# GitLab CI/CD pipeline for the JMAP-Mail FastAPI application.
# Builds a single multi-stage Docker image (Node build → Python deps → final Python),
# runs unit tests, smoke-tests the built image, and promotes it to `latest` on main.

stages:
  - build
  - test
  - release

# ---------------------------------------------------------------------------
# Dependency Proxy
#
# Every public image is pulled through GitLab's Dependency Proxy rather than
# straight from Docker Hub, so the pipeline stops burning anonymous pull quota.
#
# Two mechanisms are involved, which is easy to trip over:
#
#   • Job `image:` and `services:` — the runner authenticates to the proxy on
#     its own, so prefixing the name is all that is required.
#   • `FROM` lines inside the Dockerfile — those are pulled by the dind daemon,
#     which has no such credentials. That needs an explicit `docker login`
#     against $CI_DEPENDENCY_PROXY_SERVER plus the prefix passed as a build arg.
#
# The proxy only fronts Docker Hub. Anything from $CI_REGISTRY keeps using the
# registry login, which is why build:image performs both.
#
# Docker is pinned to an exact patch version rather than a floating major tag.
# This mirrors the configuration already proven against this GitLab instance in
# the sibling `cove` project; a floating `docker:26` tag did not come up as a
# proxied service here.
# ---------------------------------------------------------------------------

.docker_base:
  tags:
    - saas-linux-small-amd64
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:24.0.5
  services:
    # Explicit alias: GitLab derives a service's hostname from its image name,
    # so the dependency-proxy prefix would otherwise move it away from "docker"
    # and every command would sit waiting on a host that never appears.
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:24.0.5-dind
      alias: docker
  variables:
    # Scoped to the dind jobs rather than set globally — the plain python and
    # node jobs have no daemon and no business carrying TLS settings for one.
    DOCKER_TLS_CERTDIR: "/certs"

.proxy-login: &proxy-login
  - docker login -u "$CI_DEPENDENCY_PROXY_USER" -p "$CI_DEPENDENCY_PROXY_PASSWORD" "$CI_DEPENDENCY_PROXY_SERVER"

# Bounded rather than `until docker info; do sleep 1; done`: an unbounded wait
# turns a dead service into a job that hangs until the pipeline timeout with no
# explanation. GitLab only *warns* when a service image fails to pull, so this
# is a failure mode worth naming explicitly.
.wait-for-docker: &wait-for-docker
  - |
    for i in $(seq 1 30); do
      docker info > /dev/null 2>&1 && break
      echo "Waiting for Docker daemon... ($i/30)"
      sleep 2
    done
    if ! docker info > /dev/null 2>&1; then
      echo "ERROR: the docker-in-docker service never became reachable."
      echo "  DOCKER_HOST=${DOCKER_HOST:-<unset>}"
      echo "  DOCKER_TLS_CERTDIR=${DOCKER_TLS_CERTDIR:-<unset>}"
      echo "Check the 'services' section of this job's log for a failed image pull."
      docker info || true
      exit 1
    fi

# ---------------------------------------------------------------------------
# build stage — compile the image and push two tags to the registry:
#   • :$CI_COMMIT_SHORT_SHA  — immutable, identifies this exact commit
#   • :$CI_COMMIT_REF_SLUG   — mutable branch/tag pointer, reused as layer cache
# ---------------------------------------------------------------------------
build-image:
  extends: .docker_base
  stage: build
  before_script:
    - *wait-for-docker
    # Two registries, two logins: the proxy for the Dockerfile's public base
    # images, $CI_REGISTRY for pulling the cache tag and pushing the result.
    - *proxy-login
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" || true
    # BASE_REGISTRY defaults to empty in the Dockerfile so a plain
    # `docker build .` still works off Docker Hub; CI supplies the proxy prefix.
    # The trailing slash lives here, because the predefined variable has none.
    - |
      docker build \
        --build-arg BASE_REGISTRY="${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/" \
        --cache-from "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" \
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" \
        .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# test stage — three jobs run in parallel:
#   1. backend-tests  — pytest unit tests, no Docker required
#   2. frontend-tests — svelte-check type check + vitest unit tests
#   3. smoke-test     — start the built container, assert /health returns ok
# ---------------------------------------------------------------------------

backend-tests:
  stage: test
  tags:
    - saas-linux-small-amd64
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.13-slim
  script:
    - cd backend
    - pip install --quiet -r requirements-dev.txt
    - pytest --tb=short -q
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

frontend-tests:
  stage: test
  tags:
    - saas-linux-small-amd64
  # Matches the Dockerfile's build stage; @sveltejs/vite-plugin-svelte 7 and
  # vitest 4 both require Node >= 20.19, and the image here should not drift
  # from the one that produces the release artifact.
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:24-alpine
  script:
    - cd frontend
    # `npm ci`, not `npm install`: CI should fail on lockfile drift rather than
    # quietly resolving a tree that differs from the one we ship.
    - npm ci
    - npm run check
    - npm test
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# Dependency audit — CVE scan of both manifests through the internal registry.
#
# The minireg CLI is a single stdlib-only Python script, and it parses
# requirements.txt and package-lock.json itself, so one Python image audits both
# projects with no Node and no npm install.
#
# Two environmental details, neither of them minireg's doing:
#   • CI containers cannot resolve the internal DNS zone, so the host is pinned.
#   • python:*-slim ships no curl, so the CLI is fetched with stdlib urllib.
#
# The job runs only when MINIREG_ENABLED is exactly "true". Two CI/CD variables
# are needed (Settings → CI/CD → Variables):
#
#   MINIREG_ENABLED = true          the opt-in switch
#   MINIREG_TOKEN   = <read token>  masked; `read` scope is enough
#
# An explicit flag rather than inferring from the token's presence: whether a
# security gate is active should be a stated decision, not a side effect of
# which secrets happen to exist. Neither variable is declared here, so the
# project settings are the only source and cannot be shadowed by this file.
# ---------------------------------------------------------------------------
dependency-audit:
  stage: test
  tags:
    - saas-linux-small-amd64
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.13-slim
  # Reads no build artifact, so it can start immediately rather than waiting
  # for the image build — security feedback arrives with the unit tests.
  needs: []
  variables:
    MINIREG_URL: https://minireg.dmz.mudhut.xyz
    MINIREG_HOST_IP: "10.12.0.185"
  before_script:
    - |
      if [ -z "${MINIREG_TOKEN:-}" ]; then
        echo "ERROR: MINIREG_ENABLED is true but MINIREG_TOKEN is not set."
        echo "Add it under Settings > CI/CD > Variables (masked, 'read' scope),"
        echo "or set MINIREG_ENABLED to anything other than 'true' to skip this job."
        exit 1
      fi
    - |
      getent hosts minireg.dmz.mudhut.xyz >/dev/null 2>&1 \
        || echo "$MINIREG_HOST_IP minireg.dmz.mudhut.xyz" >> /etc/hosts
    - |
      python3 - <<'PY'
      import os, urllib.request
      urllib.request.urlretrieve(
          os.environ["MINIREG_URL"].rstrip("/") + "/api/cli/download",
          "/usr/local/bin/minireg",
      )
      os.chmod("/usr/local/bin/minireg", 0o755)
      PY
  script:
    # --fail-on high: exit 2 at high or critical. Lower-severity findings are
    # printed and reviewed rather than blocking a release.
    - minireg audit backend  --fail-on high
    - minireg audit frontend --fail-on high
  rules:
    # The sole enable switch. Everything below matches the other jobs.
    - if: '$MINIREG_ENABLED != "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

smoke-test:
  extends: .docker_base
  stage: test
  needs:
    - build-image
  before_script:
    - *wait-for-docker
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      docker run -d --name test-app \
        -e ENVIRONMENT=development \
        -e STALWART_URL=http://localhost \
        -e OAUTH_CLIENT_ID=test \
        -e OAUTH_CLIENT_SECRET=test \
        -e OAUTH_REDIRECT_URI=http://localhost/callback \
        -e SESSION_SECRET=testsecretplaceholder00000000000 \
        -p 8000:8000 \
        "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      for i in $(seq 1 20); do
        wget -qO- http://docker:8000/health 2>/dev/null | grep -q '"status":"ok"' && break
        echo "Waiting for app to start... ($i/20)"
        sleep 2
      done
    - wget -qO- http://docker:8000/health | grep -q '"status":"ok"'
  after_script:
    - docker rm -f test-app || true
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# release stage — retag the verified SHA image as `latest` and push it.
# Runs only when changes land on the main branch.
# ---------------------------------------------------------------------------
tag-latest:
  extends: .docker_base
  stage: release
  needs:
    - smoke-test
    - backend-tests
    - frontend-tests
    # Optional so tag-latest still runs before MINIREG_TOKEN is configured;
    # once it is, a failing audit blocks promotion to :latest.
    - job: dependency-audit
      optional: true
  before_script:
    - *wait-for-docker
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker tag  "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
