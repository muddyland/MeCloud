# GitLab CI/CD pipeline for the JMAP-Mail FastAPI application.
# Builds a single multi-stage Docker image (Node build → Python deps → final Python),
# runs unit tests, smoke-tests the built image, and promotes it to `latest` on main.

# This file runs unchanged on both the internal GitLab and the public mirror.
#
# Nothing here names an internal host or service. Where packages come from is
# decided by PIP_INDEX_URL and NPM_CONFIG_REGISTRY, which pip and npm read
# themselves, so internally they resolve through the caching registry and on
# the mirror from PyPI and npmjs, with no difference in this file.
#
# The one extra job internally is a dependency audit, pulled in only when
# CI_TEMPLATES is set. On the mirror that variable does not exist, the
# include is skipped, and the pipeline is exactly what you see below.
include:
  - project: $CI_TEMPLATES
    ref: main
    file: /audit.yml
    rules:
      - if: $CI_TEMPLATES

stages:
  - build
  - test
  - release

variables:
  # Plain images by default; override per project to use a mirror.
  PYTHON_IMAGE: "python:3.14-slim"
  # Matches the Dockerfile's build stage; @sveltejs/vite-plugin-svelte 7 and
  # vitest 4 both require Node >= 20.19, and the image here should not drift
  # from the one that produces the release artifact.
  NODE_IMAGE: "node:24-alpine"
  # One image for both the docker client and the dind service, so the two
  # cannot drift apart. Whatever it is set to must be a tag that actually
  # exists: a pipeline failed here on `docker:28.6.0-dind`, which was never
  # published. Check a candidate before changing it:
  #
  #   TOKEN=$(curl -s "https://auth.docker.io/token?service=registry.docker.io&scope=repository:library/docker:pull" | jq -r .token)
  #   curl -so /dev/null -w '%{http_code}\n' -H "Authorization: Bearer $TOKEN" \
  #     https://registry-1.docker.io/v2/library/docker/manifests/29.8.2-dind
  DOCKER_IMAGE: "docker:29.8.2"
  # Prefix for the Dockerfile's FROM lines. Empty means Docker Hub.
  BASE_REGISTRY: ""
  # Set USE_DHI to "true" to build the final image on a Docker Hardened Image
  # (no shell, no package manager, non-root) instead of python:3.14-slim. Off
  # by default, so the public mirror builds on slim. DHI_PYTHON_IMAGE is the
  # repository without a tag: the build installs into its "-dev" variant and
  # ships the plain one. The default is Docker's own DHI registry, which needs
  # a login; internally, set DHI_PYTHON_IMAGE as a CI/CD variable to the
  # registry mirror instead (kept out of this file, which is mirrored public).
  USE_DHI: "false"
  DHI_PYTHON_IMAGE: "dhi.io/python"
  DHI_PYTHON_TAG: "3.14-alpine"

.docker_base:
  tags:
    - saas-linux-small-amd64
  image: $DOCKER_IMAGE
  services:
    # Explicit alias: GitLab derives a service's hostname from its image name,
    # so a registry prefix would otherwise move it away from "docker" and
    # every command would sit waiting on a host that never appears.
    - name: $DOCKER_IMAGE-dind
      alias: docker
  variables:
    # Scoped to the dind jobs rather than set globally — the plain python and
    # node jobs have no daemon and no business carrying TLS settings for one.
    DOCKER_TLS_CERTDIR: "/certs"

# Bounded rather than `until docker info; do sleep 1; done`: an unbounded wait
# turns a dead service into a job that hangs until the pipeline timeout with no
# explanation. GitLab only *warns* when a service image fails to pull, so this
# is a failure mode worth naming explicitly.
.wait-for-docker: &wait-for-docker
  - |
    for i in $(seq 1 30); do
      docker info > /dev/null 2>&1 && break
      echo "Waiting for Docker daemon... ($i/30)"
      sleep 2
    done
    if ! docker info > /dev/null 2>&1; then
      echo "ERROR: the docker-in-docker service never became reachable."
      echo "  DOCKER_HOST=${DOCKER_HOST:-<unset>}"
      echo "  DOCKER_TLS_CERTDIR=${DOCKER_TLS_CERTDIR:-<unset>}"
      echo "  this job requested: ${DOCKER_IMAGE}-dind"
      # Printed because a failure here once named an image no file in this repo
      # references, and unprefixed at that. If the 'services' section shows a
      # different image from the line above, the service is being injected from
      # outside the pipeline -- runner config.toml, a group CI/CD variable, or a
      # compliance-framework pipeline -- and nothing in this file will fix it.
      echo "Check the 'services' section of this job's log for a failed image pull."
      docker info || true
      exit 1
    fi

# ---------------------------------------------------------------------------
# build stage — compile the image and push two tags to the registry:
#   • :$CI_COMMIT_SHORT_SHA  — immutable, identifies this exact commit
#   • :$CI_COMMIT_REF_SLUG   — mutable branch/tag pointer
# plus a layer cache for the Rust stage, :desktop-cache-$CI_COMMIT_REF_SLUG.
#
# Why a separate cache image: an image only carries cache for its own layers,
# and the final image contains none of the desktop-builder stage — so
# --cache-from on the final tag alone never saved the Rust build, which is the
# slow part. The stage is built and pushed on its own with inline cache
# metadata, and the final build reads both. A branch with no cache of its own
# yet falls back to main's.
# ---------------------------------------------------------------------------
build-image:
  extends: .docker_base
  stage: build
  before_script:
    - *wait-for-docker
    # $CI_REGISTRY for pulling the cache tags and pushing the result.
    # --password-stdin keeps the token out of the process list.
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    # `latest` is the release tag, promoted only by tag-latest after every test
    # has passed. A branch or tag whose slug is also `latest` would overwrite
    # it here, in the build stage, before any test ran.
    - |
      case "$CI_COMMIT_REF_SLUG" in
        latest|desktop-cache-*)
          echo "ERROR: the ref '$CI_COMMIT_REF_NAME' maps to the reserved tag '$CI_COMMIT_REF_SLUG'. Rename it."
          exit 1 ;;
      esac
    - |
      DESKTOP_CACHE="$CI_REGISTRY_IMAGE:desktop-cache-$CI_COMMIT_REF_SLUG"
      for ref in "$DESKTOP_CACHE" "$CI_REGISTRY_IMAGE:desktop-cache-main" \
                 "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" "$CI_REGISTRY_IMAGE:main"; do
        docker pull -q "$ref" || true
      done
    # BASE_REGISTRY defaults to empty, so base images come from Docker Hub.
    # Set it (trailing slash included) to build from a mirror instead.
    # Push a single image manifest. Docker 29 builds into the containerd image
    # store and attaches a provenance attestation by default, which turns the
    # push into an OCI index; the GitLab registry rejects that with "blob
    # unknown to registry". Without attestations the push is one manifest.
    #
    # USE_DHI swaps only the two Python stages. They have to be a matching
    # pair (the -dev builder and its runtime) because the dependency stage
    # compiles against the builder's libc, so both are set together or not at
    # all.
    - |
      PY_ARGS=""
      if [ "$USE_DHI" = "true" ]; then
        echo "USE_DHI=true: final image on ${DHI_PYTHON_IMAGE}:${DHI_PYTHON_TAG}"
        PY_ARGS="--build-arg PYTHON_BUILDER_IMAGE=${DHI_PYTHON_IMAGE}:${DHI_PYTHON_TAG}-dev"
        PY_ARGS="$PY_ARGS --build-arg PYTHON_RUNTIME_IMAGE=${DHI_PYTHON_IMAGE}:${DHI_PYTHON_TAG}"
      fi
      COMMON="--provenance=false --sbom=false --build-arg BUILDKIT_INLINE_CACHE=1"
      COMMON="$COMMON --build-arg BASE_REGISTRY=$BASE_REGISTRY"
      CACHE="--cache-from $DESKTOP_CACHE --cache-from $CI_REGISTRY_IMAGE:desktop-cache-main"

      docker build $COMMON $CACHE --target desktop-builder --tag "$DESKTOP_CACHE" .
      docker build $COMMON $PY_ARGS $CACHE \
        --cache-from "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" \
        --cache-from "$CI_REGISTRY_IMAGE:main" \
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" \
        .
    - docker push "$DESKTOP_CACHE"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# test stage — three jobs run in parallel:
#   1. backend-tests  — pytest unit tests, no Docker required
#   2. frontend-tests — svelte-check type check + vitest unit tests
#   3. smoke-test     — start the built container, assert /health returns ok
# ---------------------------------------------------------------------------

backend-tests:
  stage: test
  tags:
    - saas-linux-small-amd64
  image: $PYTHON_IMAGE
  script:
    - cd backend
    - pip install --quiet -r requirements-dev.txt
    - pytest --tb=short -q
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

frontend-tests:
  stage: test
  tags:
    - saas-linux-small-amd64
  image: $NODE_IMAGE
  script:
    - cd frontend
    # Every tarball must come from the public registry. Installing through a
    # private mirror records *its* URLs in the lockfile, and `npm ci` then
    # fails anywhere that mirror is unreachable (the public mirror of this
    # repo, a fresh laptop). Fix with:
    #   npm install --registry=https://registry.npmjs.org
    - |
      if grep -n '"resolved": "' package-lock.json | grep -v '"resolved": "https://registry.npmjs.org/'; then
        echo "ERROR: package-lock.json resolves the packages above outside registry.npmjs.org."
        exit 1
      fi
    # `npm ci`, not `npm install`: CI should fail on lockfile drift rather than
    # quietly resolving a tree that differs from the one we ship.
    - npm ci
    - npm run check
    - npm test
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

smoke-test:
  extends: .docker_base
  stage: test
  needs:
    - build-image
  before_script:
    - *wait-for-docker
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    # Production mode, as deployed: the host allow-list, the secret-strength
    # check, Secure cookies and HSTS are all production-only, and a smoke test
    # in development mode passed while any of them could have been broken.
    # Run read-only and without capabilities, as docker-compose.yml does.
    - |
      docker run -d --name test-app \
        --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
        -e ENVIRONMENT=production \
        -e APP_URL=http://docker:8000 \
        -e STALWART_URL=http://localhost \
        -e OAUTH_CLIENT_ID=test \
        -e OAUTH_CLIENT_SECRET=test \
        -e OAUTH_REDIRECT_URI=http://docker:8000/auth/callback \
        -e SESSION_SECRET=0123456789abcdef0123456789abcdef0123456789abcdef \
        -p 8000:8000 \
        "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      for i in $(seq 1 20); do
        wget -qO- http://docker:8000/health 2>/dev/null | grep -q '"status":"ok"' && break
        echo "Waiting for app to start... ($i/20)"
        sleep 2
      done
    - wget -qO- http://docker:8000/health | grep -q '"status":"ok"'
    # The SPA shell is served, and its policy names the boot script by hash
    # rather than allowing all inline script.
    - wget -qO- http://docker:8000/ | grep -q '_app/immutable/entry/start'
    - wget -S -qO /dev/null http://docker:8000/ 2>&1 | tee /tmp/headers | grep -qi "script-src 'self' 'sha256-"
    - grep -qi 'strict-transport-security' /tmp/headers
    # `if … exit 1`, never a bare `! cmd`: under `set -e` a negated command
    # cannot fail the job, so the check would pass whatever it found.
    - |
      if grep -i "script-src[^;]*unsafe-inline" /tmp/headers; then
        echo "ERROR: script-src allows 'unsafe-inline'"; exit 1
      fi
    # The host allow-list is live: addressed by bare IP, the Host header is not
    # one APP_URL names, and the request must be refused.
    - |
      IP=$(getent hosts docker | awk '{print $1; exit}')
      if wget -qO- "http://$IP:8000/health"; then
        echo "ERROR: a request for an unlisted host ($IP) was served"; exit 1
      fi
  after_script:
    - docker logs test-app 2>&1 | tail -50 || true
    - docker rm -f test-app || true
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# release stage — retag the verified SHA image as `latest` and push it.
# Runs only when changes land on the main branch.
# ---------------------------------------------------------------------------
tag-latest:
  extends: .docker_base
  stage: release
  needs:
    - smoke-test
    - backend-tests
    - frontend-tests
    # Optional because the audit only exists on the instance that has the
    # shared templates. Where it does run, a failing audit blocks promotion
    # to :latest.
    - job: audit:dependencies
      optional: true
  before_script:
    - *wait-for-docker
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker tag  "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
