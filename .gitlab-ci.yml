# GitLab CI/CD pipeline for the JMAP-Mail FastAPI application.
# Builds a single multi-stage Docker image (Node build → Python deps → final Python),
# runs unit tests, smoke-tests the built image, and promotes it to `latest` on main.

stages:
  - build
  - test
  - release

variables:
  DOCKER_TLS_CERTDIR: "/certs"

# ---------------------------------------------------------------------------
# Dependency Proxy
#
# Every public base image below is pulled through GitLab's Dependency Proxy
# rather than straight from Docker Hub, so the pipeline stops burning anonymous
# Docker Hub pull quota and gets a warm local cache instead.
#
# Two different mechanisms are involved, which is easy to trip over:
#
#   • Job `image:` — the runner authenticates to the proxy on its own, so
#     prefixing the name is all that is required.
#   • `FROM` lines inside the Dockerfile — those are pulled by the dind daemon,
#     which has no such credentials. That needs an explicit `docker login`
#     (see .proxy-login) plus the prefix passed in as a build arg.
#
# The `docker:26-dind` SERVICE is deliberately NOT proxied. Prefixing it made
# the service fail to start, and GitLab does not fail a job when a service
# image cannot be pulled — it warns and carries on, so the `docker` alias
# resolved to a container that was never running and every subsequent command
# died with "dial tcp ...:2376: connect: no route to host". Job images kept
# working throughout, so proxy auth itself is fine; it is specifically the
# service that does not tolerate the prefix here. One un-proxied image per
# dind job is a cheap price for a pipeline that starts.
#
# The proxy only fronts Docker Hub. Anything pulled from $CI_REGISTRY keeps
# using the registry login, which is why both logins appear in build-image.
# ---------------------------------------------------------------------------

.proxy-login: &proxy-login
  - |
    docker login \
      -u "$CI_DEPENDENCY_PROXY_USER" \
      -p "$CI_DEPENDENCY_PROXY_PASSWORD" \
      "$CI_DEPENDENCY_PROXY_SERVER"

# Fails the job outright if the daemon never appears. The previous version just
# fell out of the loop and let the next command run, so a dead dind service
# surfaced as an unrelated-looking "no route to host" on whichever docker
# command happened to run first. Report the actual cause instead.
.wait-for-docker: &wait-for-docker
  - |
    for i in $(seq 1 30); do
      docker info > /dev/null 2>&1 && break
      echo "Waiting for Docker daemon... ($i/30)"
      sleep 2
    done
    if ! docker info > /dev/null 2>&1; then
      echo "ERROR: the docker-in-docker service never became reachable."
      echo "  DOCKER_HOST=${DOCKER_HOST:-<unset>}"
      echo "  DOCKER_TLS_CERTDIR=${DOCKER_TLS_CERTDIR:-<unset>}"
      echo "Check the 'services' section of this job's log for a failed image pull —"
      echo "GitLab only warns when a service image cannot be pulled, it does not fail"
      echo "the job, and every later docker command then fails with 'no route to host'."
      docker info || true
      exit 1
    fi

# ---------------------------------------------------------------------------
# build stage — compile the image and push two tags to the registry:
#   • :$CI_COMMIT_SHORT_SHA  — immutable, identifies this exact commit
#   • :$CI_COMMIT_REF_SLUG   — mutable branch/tag pointer, reused as layer cache
# ---------------------------------------------------------------------------
build-image:
  stage: build
  tags:
    - saas-linux-small-amd64
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:26
  services:
    # NOT proxied — see the Dependency Proxy note at the top of this file.
    - name: docker:26-dind
      alias: docker
  before_script:
    - *wait-for-docker
    # Two registries, two logins: the proxy for the Dockerfile's public base
    # images, $CI_REGISTRY for pulling the cache tag and pushing the result.
    - *proxy-login
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" || true
    # BASE_IMAGE_PREFIX defaults to empty in the Dockerfile so a plain
    # `docker build .` still works off Docker Hub; CI supplies the proxy prefix.
    # The trailing slash lives here, because the predefined variable has none.
    - |
      docker build \
        --build-arg BASE_IMAGE_PREFIX="${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/" \
        --cache-from "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" \
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" \
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" \
        .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# test stage — three jobs run in parallel:
#   1. backend-tests  — pytest unit tests, no Docker required
#   2. frontend-tests — svelte-check type check + vitest unit tests
#   3. smoke-test     — start the built container, assert /health returns ok
# ---------------------------------------------------------------------------

backend-tests:
  stage: test
  tags:
    - saas-linux-small-amd64
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.13-slim
  script:
    - cd backend
    - pip install --quiet -r requirements-dev.txt
    - pytest --tb=short -q
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

frontend-tests:
  stage: test
  tags:
    - saas-linux-small-amd64
  # Matches the Dockerfile's build stage; @sveltejs/vite-plugin-svelte 7 and
  # vitest 4 both require Node >= 20.19, and the image here should not drift
  # from the one that produces the release artifact.
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/node:24-alpine
  script:
    - cd frontend
    # `npm ci`, not `npm install`: CI should fail on lockfile drift rather than
    # quietly resolving a tree that differs from the one we ship.
    - npm ci
    - npm run check
    - npm test
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

smoke-test:
  stage: test
  tags:
    - saas-linux-small-amd64
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:26
  services:
    # NOT proxied — see the Dependency Proxy note at the top of this file.
    - name: docker:26-dind
      alias: docker
  needs:
    - build-image
  before_script:
    - *wait-for-docker
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      docker run -d --name test-app \
        -e ENVIRONMENT=development \
        -e STALWART_URL=http://localhost \
        -e OAUTH_CLIENT_ID=test \
        -e OAUTH_CLIENT_SECRET=test \
        -e OAUTH_REDIRECT_URI=http://localhost/callback \
        -e SESSION_SECRET=testsecretplaceholder00000000000 \
        -p 8000:8000 \
        "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      for i in $(seq 1 20); do
        wget -qO- http://docker:8000/health 2>/dev/null | grep -q '"status":"ok"' && break
        echo "Waiting for app to start... ($i/20)"
        sleep 2
      done
    - wget -qO- http://docker:8000/health | grep -q '"status":"ok"'
  after_script:
    - docker rm -f test-app || true
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

# ---------------------------------------------------------------------------
# release stage — retag the verified SHA image as `latest` and push it.
# Runs only when changes land on the main branch.
# ---------------------------------------------------------------------------
tag-latest:
  stage: release
  tags:
    - saas-linux-small-amd64
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:26
  services:
    # NOT proxied — see the Dependency Proxy note at the top of this file.
    - name: docker:26-dind
      alias: docker
  needs:
    - smoke-test
    - backend-tests
    - frontend-tests
  before_script:
    - *wait-for-docker
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker tag  "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
