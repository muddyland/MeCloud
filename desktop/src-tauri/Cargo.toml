[package]
name        = "mecloud-desktop"
version     = "0.2.0"
description = "MeCloud desktop client"
edition     = "2021"
rust-version = "1.77"

[lib]
name       = "mecloud_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "mecloud-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
dirs = "5"

# Sync engine.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"

[profile.release]
# The binary is served over the network from the web UI, so size is a feature.
opt-level = "s"
lto       = true
codegen-units = 1
strip     = true
panic     = "abort"
