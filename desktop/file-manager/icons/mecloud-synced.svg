  <circle cx="8" cy="8" r="7.5" fill="#ffffff"/>
  <circle cx="8" cy="8" r="6.4" fill="#2ec27e"/>
  <path d="M4.7 8.3l2.2 2.2 4.5-4.8" fill="none" stroke="#ffffff" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
