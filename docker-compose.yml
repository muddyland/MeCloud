services:
  mecloud:
    build: .
    image: mecloud:latest
    ports:
      # Loopback by default: a reverse proxy on this host reaches it, nothing
      # else does. If the proxy runs on another machine, set MECLOUD_BIND in
      # .env (e.g. 0.0.0.0) and set FORWARDED_ALLOW_IPS to that proxy.
      - "${MECLOUD_BIND:-127.0.0.1}:8000:8000"
    env_file: .env
    restart: unless-stopped
    # The app is stateless and writes nothing to disk, so the container can be
    # locked down at no cost. The healthcheck comes from the image.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256

# Production: pull a specific image from the registry instead of building locally:
